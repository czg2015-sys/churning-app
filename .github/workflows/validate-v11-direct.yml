name: Validate Churning V1.1 Direct

on:
  push:
    branches:
      - research-v2-direct
    paths:
      - ".github/workflows/validate-v11-direct.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-v2-direct
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run build and capture result
        id: build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          code=$?
          cat /tmp/build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run lint and capture result
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          code=$?
          cat /tmp/lint.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save validation report
        shell: bash
        run: |
          {
            echo "BUILD_EXIT=${{ steps.build.outputs.exit_code }}"
            echo "LINT_EXIT=${{ steps.lint.outputs.exit_code }}"
            echo ""
            echo "===== BUILD ====="
            cat /tmp/build.log
            echo ""
            echo "===== LINT ====="
            cat /tmp/lint.log
          } > V11_VALIDATION_RESULT.txt
          rm .github/workflows/validate-v11-direct.yml
          git config user.name "Churning Build Validator"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record V1.1 build validation"
          git push origin HEAD:research-v2-direct
