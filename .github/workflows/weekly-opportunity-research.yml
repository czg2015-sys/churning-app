name: Weekly opportunity research reminder

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-research-review:
    runs-on: ubuntu-latest
    steps:
      - name: Open weekly research checklist
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `Weekly opportunity research — ${date}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'weekly-research',
              per_page: 10,
            });
            if (existing.data.some(issue => issue.title === title)) return;
            const body = [
              'Use official institution sources first. Do not promote an offer to Safety Cleared until unresolved items are reviewed.',
              '',
              '## Weekly checklist',
              '- [ ] Scan for newly launched checking, savings, HYSA, CD, direct-deposit, and debit-spend offers',
              '- [ ] Re-open every live offer official URL and verify bonus/APY, dates, qualification window, payout timing, fees, and eligibility',
              '- [ ] Re-check hard-pull, ChexSystems, and Early Warning Services evidence where available',
              '- [ ] Re-check tax reporting, FDIC/NCUA coverage, early-close/clawback language, and monthly-fee waivers',
              '- [ ] Update `last_verified_at`, evidence confidence, review notes, and safety gate in Supabase',
              '- [ ] Retire expired offers and add newly verified offers',
              '- [ ] Spot-check recommendation math against at least one realistic profile',
              '',
              '> The website treats research older than 7 days as stale. This workflow is a review process, not a substitute for official terms.',
            ].join('\n');
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['weekly-research'],
              });
            } catch (error) {
              if (error.status === 422) {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              } else {
                throw error;
              }
            }
