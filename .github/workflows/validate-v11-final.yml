name: Validate Churning V1.1 Final

on:
  push:
    branches:
      - research-v2-direct
    paths:
      - ".github/workflows/validate-v11-final.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-v2-direct
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run production build
        id: build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          code=$?
          cat /tmp/build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save final validation report
        shell: bash
        run: |
          {
            echo "BUILD_EXIT=${{ steps.build.outputs.exit_code }}"
            echo ""
            cat /tmp/build.log
          } > V11_FINAL_BUILD_RESULT.txt
          rm .github/workflows/validate-v11-final.yml
          git config user.name "Churning Build Validator"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record final V1.1 build validation"
          git push origin HEAD:research-v2-direct
