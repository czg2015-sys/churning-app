name: Install Churning V1.1 Direct

on:
  push:
    branches:
      - research-v2-direct
    paths:
      - ".churning-installer/**"
      - ".github/workflows/install-v11-direct.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-v2-direct
          fetch-depth: 0
      - name: Rebuild and extract installer
        run: |
          cat .churning-installer/p00b64_* > /tmp/part00.b64
          base64 --decode /tmp/part00.b64 > /tmp/part00
          cat /tmp/part00 .churning-installer/part01 .churning-installer/part02 .churning-installer/part03 .churning-installer/part04 .churning-installer/part05 .churning-installer/part06 .churning-installer/part07 > /tmp/churning-v11-direct-installer.zip
          unzip -t /tmp/churning-v11-direct-installer.zip
          unzip -o /tmp/churning-v11-direct-installer.zip -d .
          rm -rf .churning-installer
          rm .github/workflows/install-v11-direct.yml
      - name: Commit installed V1.1
        run: |
          git config user.name "Churning Direct Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Churning Research Agent V1.1 directly"
          git push origin HEAD:research-v2-direct
